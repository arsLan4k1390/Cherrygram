static def isWindows() {
    def osName = System.getProperty('os.name').toLowerCase()
    return osName.contains('win')
}

static def isMacOS() {
    def osName = System.getProperty('os.name').toLowerCase()
    return osName.contains('mac')
}

static def isWindowsOrMacOS() {
    def osName = System.getProperty('os.name').toLowerCase()
    return osName.contains('win') || osName.contains('mac')
}

static def getOSName() {
    def buildHost
    if (isWindows()) {
        buildHost = 'Windows'
    } else if (isMacOS()) {
        buildHost = 'macOS'
    } else {
        buildHost = 'Unknown'
    }
    return buildHost
}

def desktopPath
if (isWindows()) {
    desktopPath = "C:/Users/${SYSTEM_USERNAME}/Desktop/Cherry/Stable"
} else if (isMacOS()) {
    desktopPath = "/Users/${SYSTEM_USERNAME}/Desktop/Cherry/Stable"
}

tasks.register('copyFiles', Copy) {
    from "${projectDir}/afat/release/"
    include '**/*.apk'
    exclude 'baselineProfiles/**'
    into desktopPath
}

def fileName = "Cherrygram-Huawei-${APP_VERSION_NAME_CHERRY}-TG-${APP_VERSION_NAME}-arm64-v8a.apk"
def apkFilePath = "${projectDir}/afat/release/${fileName}"

def fileName2 = "Cherrygram-Huawei-${APP_VERSION_NAME_CHERRY}-TG-${APP_VERSION_NAME}-armeabi-v7a.apk"
def apkFilePath2 = "${projectDir}/afat/release/${fileName2}"

def fileName3 = "Cherrygram-Huawei-Beta-${APP_VERSION_NAME_CHERRY}-TG-${APP_VERSION_NAME}-universal.apk"
def apkFilePath3 = "${projectDir}/afat/release/${fileName3}"

tasks.register('sendApk') {
    doLast {
        def file = new File(apkFilePath)
        def file2 = new File(apkFilePath2)
        def file3 = new File(apkFilePath3)

        if (!file.exists() && !file2.exists() && !file3.exists()) {
            println "APK file not found: $apkFilePath"
            println "APK file not found: $apkFilePath2"
            println "APK file not found: $apkFilePath3"
            return
        }

        println "Sending APK to Cherrygram Support..."

        try {
            sendApkToTelegram(file)
            sendApkToTelegram(file2)
            sendApkToTelegram(file3)
        } catch (Exception e) {
//            println "Error sending APK: ${e.message}"
            e.printStackTrace()
        }
    }
}

static String escapeHtml(String s) {
    return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
}

void sendApkToTelegram(File file) {
    def appVersion = "App version: <b>${APP_VERSION_NAME_CHERRY} // ${APP_VERSION_NAME} (${APP_VERSION_CODE})</b>"

    def currentDateAndTime = LocalDateTime.now(ZoneOffset.UTC).format(DateTimeFormatter.ofPattern("dd.MM.yyyy, HH:mm"))
    def buildDate = "\n \nBuild date (UTC): <b>${currentDateAndTime}</b>\n"

    def buildHost = "\nBuilt on: <b>${getOSName()}</b>"

    def currentRepo = 'git rev-parse --show-toplevel'.execute().text.trim().split('/').last()
    def currentBranch = 'git rev-parse --abbrev-ref HEAD'.execute().text.trim()
    def projectName = "\n \nProject: <b>${escapeHtml(currentRepo)}</b>/${escapeHtml(currentBranch)}"

    def lastCommitAuthor = 'git log -1 --pretty=%an'.execute().text.trim()
    def author = "\nTriggered by: <b>${escapeHtml(lastCommitAuthor)}</b>"

    def fileSizeMb = String.format(Locale.US, "%.2f", file.length() / (1024.0 * 1024.0))
    def fileSizeText = "\nFile size: <b>${fileSizeMb} MB</b>"

    def fileCaption
    if (file.name.contains("arm64-v8a")) {
        fileCaption = appVersion + buildDate + "Architecture: <b>arm64-v8a</b>" + buildHost + fileSizeText + projectName + author
    } else if (file.name.contains("armeabi-v7a")) {
        fileCaption = appVersion + buildDate + "Architecture: <b>armeabi-v7a</b>" + buildHost + fileSizeText + projectName + author
    } else {
        fileCaption = appVersion + buildDate + "Architecture: <b>universal</b>" + buildHost + fileSizeText + projectName + author
    }

    println "Uploading file: ${file.name}, size: ${file.length()} bytes"

    def captionFile = File.createTempFile("tg_caption_", ".txt")
    captionFile.setText(fileCaption, "UTF-8")

    def pythonBin = TG_PYTHON_BIN ?: "python"

    def cmd = [
            pythonBin.toString(),
            "${projectDir}/scripts/send_telegram.py".toString(),
            file.absolutePath.toString(),
            captionFile.absolutePath.toString()
    ]

    def processBuilder = new ProcessBuilder(cmd)
    processBuilder.environment().put("TG_APP_ID", TG_APP_ID)
    processBuilder.environment().put("TG_APP_HASH", TG_APP_HASH)
    processBuilder.environment().put("TELEGRAM_BOT_TOKEN", TELEGRAM_BOT_TOKEN)
    processBuilder.environment().put("TELEGRAM_CHAT_ID", TELEGRAM_CHAT_ID.toString())
    processBuilder.redirectErrorStream(true)

    def process = processBuilder.start()
    def output = new StringBuilder()
    process.inputStream.eachLine { line -> output.append(line).append("\n") }
    def exitCode = process.waitFor()
    captionFile.delete()

    if (exitCode == 0) {
        println "APK successfully sent to Cherrygram Support!"
        println output.toString()
    } else {
        throw new RuntimeException("""
            ==================================================
            FAILED TO SEND APK TO TELEGRAM (kurigram)!
            --------------------------------------------------
            Exit code: ${exitCode}
            Output:
            ${output}
            ==================================================""")
    }
}

tasks.configureEach { task ->
    if (task.name == 'extractProguardFiles') {
        task.doFirst {
            delete "${projectDir}/afat/release/"
        }
    }

    if (task.name == 'assembleAfatRelease') {
        if (isWindowsOrMacOS()) {
            sendApk.mustRunAfter copyFiles
            task.finalizedBy 'copyFiles', 'sendApk'
        } else {
            task.finalizedBy 'sendApk'
        }
    }
}

